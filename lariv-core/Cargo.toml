[package]
name = "lariv-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lariv application kernel"

[features]
plugin-users = ["dep:phonenumber"]
cap-llm = ["dep:reqwest", "dep:rune"]
formula = ["dep:rune", "dep:rust_decimal"]
typst = ["dep:typst", "dep:typst-pdf", "dep:typst-kit", "dep:typst-syntax", "dep:comemo"]

[dependencies]
lariv-rs-macros.workspace = true
paste = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
frunk = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
maud = { workspace = true }
serde_json = { workspace = true }
form_urlencoded = { workspace = true }
toml = { workspace = true }
phonenumber = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rune = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
typst = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-kit = { workspace = true, optional = true }
typst-syntax = { workspace = true, optional = true }
comemo = { workspace = true, optional = true }
rand = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
cookie = { workspace = true }
pulldown-cmark = { workspace = true }
chrono-tz = { workspace = true }

[lints]
workspace = true
