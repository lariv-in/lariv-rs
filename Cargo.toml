[workspace]
members = [".", "lariv-rs-macros"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
license-file = "LICENSE"
authors = ["Sandeep Kumar <sandeepqmar05@gmail.com>"]
homepage = "https://github.com/lariv-in/lariv-rs"
repository = "https://github.com/lariv-in/lariv-rs"

[package]
name = "lariv-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Compile-time plugin web application framework built on Axum, SeaORM, Maud, and HTMX"
documentation = "https://docs.rs/lariv-rs"
keywords = ["web", "axum", "htmx", "framework", "plugins"]
categories = ["web-programming", "asynchronous"]

[features]
default = ["full"]
full = [
    "plugin-users",
    "plugin-dashboard",
    "plugin-blog",
    "plugin-filesystem",
    "plugin-website",
    "plugin-llm-assistant",
    "plugin-otp",
    "plugin-pwa",
    "plugin-export",
    "plugin-import",
    "plugin-signup",
]
plugin-users = ["dep:jsonwebtoken", "dep:scrypt", "dep:phonenumber"]
plugin-dashboard = ["plugin-users"]
plugin-blog = ["plugin-users"]
plugin-filesystem = ["plugin-users", "dep:zip", "dep:mime_guess", "dep:sha2", "dep:object_store"]
plugin-website = ["plugin-filesystem", "plugin-users", "dep:minijinja"]
plugin-llm-assistant = [
    "plugin-users",
    "plugin-filesystem",
    "cap-llm",
    "dep:zip",
    "dep:mime_guess",
    "dep:async-imap",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:lettre",
    "dep:mailparse",
    "dep:html2text",
]
plugin-otp = ["plugin-users", "dep:reqwest", "dep:lettre"]
plugin-pwa = []
plugin-export = ["plugin-users", "dep:rust_xlsxwriter"]
plugin-import = ["plugin-users", "dep:calamine"]
plugin-signup = ["plugin-users"]
finance-common = ["dep:rust_decimal"]
plugin-finance-accounts = ["plugin-users", "finance-common"]
plugin-customer = ["plugin-users"]
plugin-crm = ["plugin-users"]
plugin-finance-customer = ["plugin-customer", "plugin-finance-accounts"]
plugin-finance-taxes = ["plugin-finance-accounts"]
plugin-finance-products = ["plugin-finance-accounts", "plugin-finance-taxes"]
plugin-finance-creditnotes = ["plugin-finance-accounts"]
plugin-finance-invoices = [
    "plugin-finance-accounts",
    "plugin-finance-customer",
    "plugin-finance-products",
    "plugin-finance-taxes",
    "plugin-finance-creditnotes",
    "plugin-filesystem",
    "dep:minijinja",
    "dep:num2words",
    "dep:sha2",
    "dep:hex",
    "dep:typst",
    "dep:typst-pdf",
    "dep:typst-kit",
    "dep:typst-syntax",
    "dep:comemo",
    "dep:reqwest",
]
plugin-finance-indian = ["plugin-finance-accounts"]
plugin-finance = ["plugin-finance-invoices", "plugin-finance-indian"]
cap-llm = ["dep:reqwest", "dep:rune", "plugin-filesystem"]

[[bin]]
name = "lariv"
path = "src/bin/lariv.rs"
required-features = ["full"]

[dependencies]
lariv-rs-macros = { path = "lariv-rs-macros" }
frunk = { version = "0.5.0", features = ["serde", "std"] }
# Required so `#[derive(Generic)]` can resolve `::frunk_core::...` paths.
frunk_core = "0.5.0"
paste = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures-util = "0.3"
bytes = "1"
tempfile = "3"
axum = { version = "0.8", features = ["form", "macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace", "fs", "normalize-path"] }
tower = "0.5"

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

maud = { version = "0.27", features = ["axum"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
toml = "0.8"

jsonwebtoken = { version = "9", optional = true }
scrypt = { version = "0.11", optional = true }
phonenumber = { version = "0.3", optional = true }
minijinja = { version = "2", features = ["loader"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"], optional = true }
mailparse = { version = "0.15", optional = true }
html2text = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking", "gzip", "brotli"], optional = true }
rune = { version = "0.14", optional = true }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
zip = { version = "2", optional = true }
mime_guess = { version = "2", optional = true }
object_store = { version = "0.12", optional = true, default-features = false, features = ["gcp"] }
sha2 = { version = "0.10", optional = true }
rust_xlsxwriter = { version = "0.79", optional = true }
calamine = { version = "0.26", optional = true }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"], optional = true }
num2words = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
typst = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "datetime",
], optional = true }
typst-syntax = { version = "0.15.1", optional = true }
comemo = { version = "0.5.1", optional = true }

rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
time = "0.3"

clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
http = "1"
async-trait = "0.1"
libc = "0.2"
cookie = "0.18"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chrono-tz = "0.10.4"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["macros"] }
urlencoding = "2"

[[test]]
name = "genai_files_latency"
path = "tests/genai_files_latency.rs"
required-features = ["cap-llm"]

[[test]]
name = "plugin_compile"
path = "tests/plugin_compile.rs"
required-features = ["full"]

[[test]]
name = "finance_plugin_compile"
path = "tests/finance_plugin_compile.rs"
required-features = ["plugin-finance"]

[[test]]
name = "finance_invoice_integration"
path = "tests/finance_invoice_integration.rs"
required-features = ["plugin-finance"]

[[test]]
name = "users_integration"
path = "tests/users_integration.rs"
required-features = ["plugin-users"]

[[test]]
name = "crm_plugin_compile"
path = "tests/crm_plugin_compile.rs"
required-features = ["plugin-crm"]

[workspace.lints.clippy]
warnings = "deny"
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# Optional - see post for caveats
# expect_used = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
