database_url = "sqlite://lariv.db?mode=rwc"
bind = "0.0.0.0:3000"

[users]
adminEmail = "admin@example.com"
adminPassword = "adminadmin"

[filesystem]
storageBackend = "local"
localDir = "filesystem"
# gcsBucket = ""
# gcsCredentialsFile = ""
# gcsPrefix = ""

[meets]
roomCodeLength = 8
# anonCookieSecret = "change-me"

# MoQ relay (QUIC + HTTPS/WebTransport + WebSocket fallback).
[meets.transport]
enabled = true
bind = "0.0.0.0:4433"
# certFile = "/etc/lariv/certs/fullchain.pem"
# keyFile = "/etc/lariv/certs/privkey.pem"
# Browser-facing origin (no trailing slash). Relative URLs used when unset.
# publicUrl = "https://meet.example.com"
# authKeyFile = "/etc/lariv/moq-auth.jwk"

# Reverse proxy checklist (Caddy/nginx with HTTP/3):
# 1. Enable HTTP/3 on the public host.
# 2. Forward QUIC/HTTP/3 to meets.transport.bind.
# 3. Forward cookies (auth-token, meets-anon) to Lariv unchanged.
# 4. Lariv HTTP (bind above) stays on TCP/UDS for HTMX pages.

[pwa]
PWA_APP_NAME = "Lariv"
PWA_APP_DESCRIPTION = "Lariv Progressive Web App"
PWA_APP_THEME_COLOR = "#0f172a"
PWA_APP_BACKGROUND_COLOR = "#ffffff"
PWA_APP_DISPLAY = "standalone"
PWA_APP_SCOPE = "/"
PWA_APP_ORIENTATION = "any"
PWA_APP_START_URL = "/"
PWA_APP_DIR = "ltr"
PWA_APP_LANG = "en-US"
# staticDir = "./pwa_static"
