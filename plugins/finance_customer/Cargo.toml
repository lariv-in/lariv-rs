[package]
name = "lariv-plugin-finance-customer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lariv finance_customer plugin"

[features]
plugin-llm-assistant = ["dep:lariv-plugin-llm-assistant"]
cap-llm = ["lariv_core/cap-llm", "plugin-llm-assistant"]

[dependencies]
lariv_core = { package = "lariv-core", path = "../../lariv-core" }
lariv-rs-macros = { workspace = true }
lariv-plugin-filesystem = { path = "../filesystem" }
lariv-plugin-customer = { path = "../customer" }
lariv-plugin-finance-accounts = { path = "../finance_accounts" }
lariv-plugin-llm-assistant = { path = "../llm_assistant", optional = true }
chrono = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
maud = { workspace = true }
rune = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
