[package]
name = "lariv-plugin-website"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lariv website plugin"

[features]
default = []
plugin-llm-assistant = ["dep:lariv-plugin-llm-assistant", "dep:rune"]
cap-llm = ["lariv_core/cap-llm", "plugin-llm-assistant"]

[dependencies]
lariv_core = { package = "lariv-core", path = "../../lariv-core" }
lariv-rs-macros = { workspace = true }
lariv-plugin-filesystem = { path = "../filesystem" }
lariv-plugin-users = { path = "../users" }
lariv-plugin-llm-assistant = { path = "../llm_assistant", optional = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
http = { workspace = true }
maud = { workspace = true }
minijinja = { workspace = true }
rune = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
