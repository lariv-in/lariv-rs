[package]
name = "lariv-plugin-finance-accounts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lariv finance_accounts plugin"

[features]
default = []
cap-llm = ["lariv_core/cap-llm", "dep:rune", "dep:tokio"]

[dependencies]
lariv_core = { package = "lariv-core", path = "../../lariv-core" }
lariv-formula = { workspace = true }
lariv-rs-macros = { workspace = true }
lariv-plugin-users = { path = "../users" }
lariv-plugin-filesystem = { path = "../filesystem" }
lariv-plugin-finance-common = { path = "../finance_common" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
http = { workspace = true }
maud = { workspace = true }
rune = { workspace = true, optional = true }
rust_decimal = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }

[lints]
workspace = true
