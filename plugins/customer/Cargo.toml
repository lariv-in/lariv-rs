[package]
name = "lariv-plugin-customer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Customer records support addon (create modal + reusable table)"

[features]
default = []
plugin-llm-assistant = ["dep:lariv-plugin-llm-assistant"]
cap-llm = ["lariv_core/cap-llm", "plugin-llm-assistant"]

[dependencies]
lariv_core = { package = "lariv-core", path = "../../lariv-core" }
lariv-rs-macros = { workspace = true }
lariv-plugin-contacts = { path = "../contacts" }
lariv-plugin-users = { path = "../users" }
lariv-plugin-llm-assistant = { path = "../llm_assistant", optional = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
maud = { workspace = true }
rune = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
