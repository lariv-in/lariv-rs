[package]
name = "lariv-plugin-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lariv tasks plugin"

[features]
default = []

[dependencies]
lariv_core = { package = "lariv-core", path = "../../lariv-core" }
lariv-rs-macros = { workspace = true }
lariv-plugin-pwa = { path = "../pwa" }
lariv-plugin-users = { path = "../users" }
anyhow = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
http = { workspace = true }
jwt-simple = { version = "0.12.11", default-features = false, features = ["pure-rust"] }
maud = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
web-push = { version = "0.11", default-features = false }

[lints]
workspace = true
