<div class="gjs-slider" data-gjs-type="p_website.slider" data-gjs-custom-name="Slider">
  <div class="gjs-slider-track" data-gjs-droppable="true">
    <div class="gjs-slider-slide is-active" data-gjs-droppable="true"><p data-gjs-editable="true">Slide one</p></div>
    <div class="gjs-slider-slide" data-gjs-droppable="true" hidden><p data-gjs-editable="true">Slide two</p></div>
    <div class="gjs-slider-slide" data-gjs-droppable="true" hidden><p data-gjs-editable="true">Slide three</p></div>
  </div>
  <div class="gjs-slider-nav">
    <button type="button" class="gjs-slider-prev" data-gjs-editable="false">Prev</button>
    <button type="button" class="gjs-slider-next" data-gjs-editable="false">Next</button>
  </div>
</div>
